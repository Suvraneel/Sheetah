name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Fails if a DuckDB extension is missing or its SHA-256 doesn't match the lock file.
      - run: npm run build
      - name: Lock file must be committed
        run: git diff --exit-code scripts/duckdb-extensions.lock.json
      - run: npx playwright install --with-deps chromium
      # End-to-end suite against the production build, under the real security headers:
      # grid, files, saved views, accessibility (axe) and the exfiltration attack queries.
      - run: npx playwright test --grep-invert @perf
      - run: npx playwright test --grep @perf --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
